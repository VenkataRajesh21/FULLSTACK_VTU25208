<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Anti-Gravity</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="display: flex; align-items: center; justify-content: center;">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2" style="bottom: 0; top: auto;"></div>

    <div class="glass-panel animate-up" style="width: 100%; max-width: 400px; padding: 3rem;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <a href="index.html" class="logo" style="justify-content: center; margin-bottom: 1rem;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="var(--accent-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Anti<span>Gravity</span>
            </a>
            <h2>Welcome Back</h2>
            <p>Enter your credentials to continue</p>
        </div>

        <form id="loginForm">
            <div id="error-msg" style="color: #ff7675; margin-bottom: 1rem; text-align: center; font-size: 0.9rem;"></div>
            
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="you@example.com">
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="12345678">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Login</button>
        </form>
        
        <p style="text-align: center; margin-top: 2rem; font-size: 0.9rem;">
            Don't have an account? <a href="register.html" style="color: var(--accent-secondary); text-decoration: none;">Sign Up</a>
        </p>
    </div>

    <script src="js/main.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            const btn = e.target.querySelector('button');
            btn.textContent = 'Logging in...';
            btn.disabled = true;

            const res = await apiCall('auth.php', 'POST', { action: 'login', email: email, password: password });
            
            if (res.error) {
                errorMsg.textContent = res.error;
                btn.textContent = 'Login';
                btn.disabled = false;
            } else if (res.user) {
                localStorage.setItem('ag_user', JSON.stringify(res.user));
                window.location.href = res.user.role === 'seeker' ? 'dashboard-seeker.html' : 'dashboard-employer.html';
            }
        });
    </script>
</body>
</html>
