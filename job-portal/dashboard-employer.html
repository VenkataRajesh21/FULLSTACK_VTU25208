<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard | Anti-Gravity</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="floating-shape shape-2" style="opacity: 0.1;"></div>

    <header class="container">
        <nav class="navbar">
            <a href="index.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke="var(--accent-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                Anti<span>Gravity</span>
            </a>
            <div class="nav-links">
                <span id="userEmail" style="color: var(--text-secondary); margin-right: 1rem;"></span>
                <a href="#" onclick="logout()" class="btn btn-secondary" style="padding: 0.5rem 1rem; border-radius: 8px;">Logout</a>
            </div>
        </nav>
    </header>

    <main class="container animate-up">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2>Your Dashboard</h2>
            <button onclick="document.getElementById('postModal').style.display='block'" class="btn btn-primary" style="padding: 0.8rem 1.5rem;">+ Post New Job</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 2fr; gap: 2rem;">
            <!-- Jobs Posted -->
            <div>
                <h3>Your Postings</h3>
                <div id="jobs-list" style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem;">
                    <p>Loading jobs...</p>
                </div>
            </div>

            <!-- Applicants -->
            <div>
                <h3>Recent Applications</h3>
                <div id="apps-container" class="glass-panel" style="padding: 1rem; margin-top: 1rem;">
                    <p>Loading applicants...</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Post Job Modal -->
    <div id="postModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; backdrop-filter: blur(5px);">
        <div class="glass-panel" style="max-width: 500px; margin: 10vh auto; position: relative;">
            <button onclick="document.getElementById('postModal').style.display='none'" style="position: absolute; right: 1rem; top: 1rem; background: none; border: none; color: white; cursor: pointer; font-size: 1.5rem;">×</button>
            <h3 style="margin-bottom: 1.5rem;">Post a New Opportunity</h3>
            <form id="postJobForm">
                <div class="input-group">
                    <label for="title">Job Title</label>
                    <input type="text" id="title" required>
                </div>
                <div class="input-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" placeholder="e.g. Remote, New York...">
                </div>
                <div class="input-group">
                    <label for="description">Description</label>
                    <textarea id="description" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Post Job</button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        const user = checkAuth('employer');
        if (user) {
            document.getElementById('userEmail').textContent = user.email;
            loadJobs();
            loadApplications();
        }

        document.getElementById('postJobForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.textContent = 'Posting...';
            btn.disabled = true;

            const data = {
                employer_id: user.id,
                title: document.getElementById('title').value,
                location: document.getElementById('location').value,
                description: document.getElementById('description').value
            };

            const res = await apiCall('jobs.php', 'POST', data);
            if (res.error) {
                alert(res.error);
            } else {
                document.getElementById('postModal').style.display = 'none';
                e.target.reset();
                loadJobs();
            }
            btn.textContent = 'Post Job';
            btn.disabled = false;
        });

        async function loadJobs() {
            const jobs = await apiCall(`jobs.php?employer_id=${user.id}`);
            const container = document.getElementById('jobs-list');
            
            if (jobs.error || jobs.length === 0) {
                container.innerHTML = '<p style="color: var(--text-secondary);">No jobs posted yet.</p>';
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="glass-panel" style="padding: 1.5rem; transition: none;">
                    <h4 style="margin-bottom: 0.5rem;">${job.title}</h4>
                    <div style="font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem;">
                        📍 ${job.location || 'Remote'} | 🕒 ${new Date(job.created_at).toLocaleDateString()}
                    </div>
                    <span style="background: ${job.status === 'open' ? 'rgba(0, 206, 201, 0.2)' : 'rgba(255, 118, 117, 0.2)'}; color: ${job.status === 'open' ? 'var(--accent-secondary)' : '#ff7675'}; padding: 0.3rem 0.8rem; border-radius: 20px; font-size: 0.75rem;">
                        ${job.status.toUpperCase()}
                    </span>
                </div>
            `).join('');
        }

        async function loadApplications() {
            const apps = await apiCall(`applications.php?employer_id=${user.id}`);
            const container = document.getElementById('apps-container');
            
            if (apps.error || apps.length === 0) {
                container.innerHTML = '<p>No applications received yet.</p>';
                return;
            }

            container.innerHTML = `
                <div style="display: flex; flex-direction: column; gap: 1rem;">
                    ${apps.map(app => `
                        <div style="border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 1rem;">
                            <div style="display: flex; justify-content: space-between; align-items: flex-start;">
                                <div>
                                    <h4 style="margin-bottom: 0.2rem;">${app.applicant_name}</h4>
                                    <div style="font-size: 0.8rem; color: var(--accent-secondary); margin-bottom: 0.5rem;">Applied for: ${app.title}</div>
                                    <div style="font-size: 0.8rem; color: var(--text-secondary);">Date: ${new Date(app.applied_at).toLocaleDateString()}</div>
                                </div>
                                <div>
                                    <select onchange="updateStatus(${app.id}, this.value)" style="padding: 0.5rem; background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); border-radius: 8px; color: white; cursor: pointer;">
                                        <option value="pending" ${app.status === 'pending' ? 'selected' : ''}>Pending</option>
                                        <option value="reviewed" ${app.status === 'reviewed' ? 'selected' : ''}>Reviewed</option>
                                        <option value="shortlisted" ${app.status === 'shortlisted' ? 'selected' : ''}>Shortlisted</option>
                                        <option value="rejected" ${app.status === 'rejected' ? 'selected' : ''}>Rejected</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        async function updateStatus(appId, newStatus) {
            const res = await apiCall(`applications.php?action=update_status`, 'POST', {
                application_id: appId,
                status: newStatus
            });
            if (res.error) {
                alert(res.error);
                loadApplications(); // reload to revert to old status visually
            }
        }
    </script>
</body>
</html>
