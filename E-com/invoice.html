<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Invoice</title>
<script>
if (localStorage.getItem("loggedIn") !== "true") {
    window.location.href = "login.html";
}
</script>
<style>
* {
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

body {
    background: #f4f6fb;
    padding: 30px;
}

/* INVOICE CONTAINER */
.invoice-box {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 30px;
    border-radius: 18px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
}

/* HEADER */
.invoice-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid #eee;
    padding-bottom: 15px;
    margin-bottom: 20px;
}

.invoice-header h1 {
    color: #1e2a78;
}

.company-details {
    text-align: right;
    font-size: 14px;
}

/* CUSTOMER INFO */
.section {
    margin-bottom: 25px;
}

.section h3 {
    margin-bottom: 10px;
    color: #1e2a78;
}

/* TABLE */
table {
    width: 100%;
    border-collapse: collapse;
}

table th, table td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: center;
}

table th {
    background: #f4f6fb;
}

/* TOTAL */
.total-box {
    text-align: right;
    margin-top: 20px;
    font-size: 18px;
}

/* BUTTONS */
.actions {
    margin-top: 30px;
    text-align: center;
}

.actions button {
    padding: 12px 20px;
    margin: 5px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    font-size: 15px;
}

.print-btn {
    background: #1e2a78;
    color: white;
}

.home-btn {
    background: #1db954;
    color: white;
}

/* PRINT */
@media print {
    body {
        background: white;
        padding: 0;
    }
    .actions {
        display: none;
    }
    .invoice-box {
        box-shadow: none;
        border-radius: 0;
    }
}
</style>
</head>

<body>

<div class="invoice-box">
    <div class="invoice-header">
        <h1>🧾 Invoice</h1>
        <div class="company-details">
            <b>ShopEasy</b><br>
            Chennai, India<br>
            support@shopeasy.com
        </div>
    </div>

    <div class="section" id="customer-info"></div>
    <div class="section" id="order-info"></div>

    <div class="total-box" id="total-box"></div>

    <div class="actions">
        <button class="print-btn" onclick="window.print()">Print / Save PDF</button>
        <button class="home-btn" onclick="goHome()">Back to Shop</button>
    </div>
</div>

<script>
const order = JSON.parse(localStorage.getItem("order"));

if (!order) {
    document.body.innerHTML = "<h2>No order found</h2>";
}

/* CUSTOMER INFO */
document.getElementById("customer-info").innerHTML = `
    <h3>Customer Details</h3>
    <p><b>Name:</b> ${order.customer.name}</p>
    <p><b>Address:</b> ${order.customer.address}</p>
    <p><b>Phone:</b> ${order.customer.phone}</p>
    <p><b>Date:</b> ${order.date}</p>
`;

/* ORDER TABLE */
let tableHTML = `
    <h3>Order Details</h3>
    <table>
        <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Qty</th>
            <th>Total</th>
        </tr>
`;

order.items.forEach(item => {
    tableHTML += `
        <tr>
            <td>${item.name}</td>
            <td>₹${item.price}</td>
            <td>${item.qty}</td>
            <td>₹${item.price * item.qty}</td>
        </tr>
    `;
});

tableHTML += `</table>`;
document.getElementById("order-info").innerHTML = tableHTML;

/* TOTAL */
document.getElementById("total-box").innerHTML = `
    <b>Grand Total: ₹${order.total}</b>
`;

/* BACK TO HOME */
function goHome() {
    localStorage.removeItem("order");
    window.location.href = "index.html";
}
</script>

</body>
</html>
